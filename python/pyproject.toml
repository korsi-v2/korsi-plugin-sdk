[project]
name = "korsi-plugin"
version = "0.1.0"
description = "The server side of a Korsi plugin: Korsi's signature, the lifecycle, events, tools, and a typed client for the plugin plane."
readme = "README.md"
# A plugin is somebody else's system: it runs on the Python its publisher chose, so the SDK asks for
# no more than it uses (TypedDict's NotRequired and typing.Self, both 3.11).
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
]
keywords = ["korsi", "plugin", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korsi_plugin"]

[tool.uv]
# A plugin that depends on this checkout by path gets it rebuilt when the code changes, not only
# when this file does.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/korsi_plugin/models.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "ANN", "BLE"]
ignore = [
    "ANN401",
    "RUF001", "RUF002", "RUF003",
    "N818",    # exceptions read as outcomes at the raise site, as in korsi-api
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
